name: Desktop web verification
on:
  push:
    branches: [main, feat/desktop-spatial-workspace]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Domain tests
        run: npm run test --if-present
      - name: Build review archive
        if: always()
        run: |
          tar --exclude=.git --exclude='*.tar.gz' --exclude=.env --exclude='*.sqlite*' --exclude='*.db' -czf desktop-review.tar.gz src backend tests data eval public package.json package-lock.json tsconfig*.json vite.config.* index.html node_modules 2>/dev/null || test -s desktop-review.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-review
          path: |
            desktop-review.tar.gz
            dist/
          retention-days: 3
