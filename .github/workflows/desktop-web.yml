# The historical file/branch name means a computer browser, NOT a native app.
name: Web workspace verification
on:
  push:
    branches: [main, feat/desktop-spatial-workspace]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend constraints and parity fixture
        run: npm run test:parity
      - name: Type-check and build website
        run: npm run build
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend API, persistence and same-origin website tests
        env:
          LABSAFETY_LLM_API_KEY: ''
          AEGIS_WORKSPACE_TOKEN: ''
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: aegislab-web-build
          path: dist/
          retention-days: 3
