[project]
name = "aegislab-backend"
version = "0.2.0"
description = "Browser-based laboratory resource and evidence review workspace"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "python-docx>=1.1,<2.0",
  "pypdf>=5.0,<7.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8,<9"]

[tool.uvicorn]
factory = false
